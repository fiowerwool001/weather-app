<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ฟ้าฝนวันนี้</title>
<meta name="description" content="พยากรณ์ฝน อุณหภูมิ และลม ราย 3 ชั่วโมง ล่วงหน้า 16 วัน พร้อมแผนที่ฝนและเมฆ">
<meta name="theme-color" content="#3a3d42">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ฟ้าฝน">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: grey search bar, full-colour weather map, dark 16-day strip with temperature hills, light 3-hour table, red tool bar pinned to the bottom. */
:root {
  --chrome: #3a3d42;
  --chrome-2: #4a4e54;
  --chrome-3: #2f3236;
  --chrome-ink: #f4f5f6;
  --chrome-muted: #b9bec4;
  --bar: #9b1c1c;
  --bar-ink: #ffffff;
  --accent: #b42318;
  --bg: #ffffff;
  --ink: #1f2328;
  --muted: #8a9096;
  --line: #e7e9ec;
  --night: #eceaf6;
  --rain: #2b6fcf;
  --temp-fill: #f6dbe6;
  --rain-fill: #cfe6f7;
  --hill: #c9a9c9;
  --sun: #f5b21c;
  --cloud: #b7bcc2;
  --cloud-2: #8b9298;
  --bolt: #f5b21c;
  --moon: #c9ced4;
  --warn: #e07b16;
  --font: "IBM Plex Sans Thai", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d2024; --ink: #eef0f2; --muted: #9aa1a8; --line: #2e3237; --night: #26243a;
    --rain: #74b3ff; --temp-fill: #4a2d3a; --rain-fill: #1f3a55; --cloud: #a5abb1; --cloud-2: #cfd3d7; --moon: #d5d9dd;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1d2024; --ink: #eef0f2; --muted: #9aa1a8; --line: #2e3237; --night: #26243a;
  --rain: #74b3ff; --temp-fill: #4a2d3a; --rain-fill: #1f3a55; --cloud: #a5abb1; --cloud-2: #cfd3d7; --moon: #d5d9dd;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); -webkit-text-size-adjust: 100%; padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid #4da3ff; outline-offset: 2px; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- search bar ---------- */
.top { position: sticky; top: 0; z-index: 1000; background: var(--chrome); color: var(--chrome-ink);
  padding: calc(env(safe-area-inset-top, 0px) + 8px) max(14px, env(safe-area-inset-right, 0px)) 8px max(14px, env(safe-area-inset-left, 0px)); }
.searchrow { display: flex; align-items: center; gap: 6px; max-width: 1100px; margin: 0 auto; }
.search { flex: 1; min-width: 0; position: relative; }
.search input { width: 100%; background: transparent; border: 0; border-bottom: 1px solid #6a6f75; color: var(--chrome-ink); font-size: 1.6rem; font-weight: 500; padding: 4px 4px 6px 40px; }
.search input::placeholder { color: var(--chrome-muted); font-size: 1.2rem; }
.search > svg { position: absolute; left: 2px; top: 50%; transform: translateY(-50%); }
.iconbtn { background: none; border: 0; padding: 6px; display: grid; place-items: center; color: var(--chrome-ink); border-radius: 10px; }
.iconbtn:hover { background: var(--chrome-2); }
.iconbtn[aria-pressed="true"] svg path { fill: #e5484d; stroke: #e5484d; }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--bg); color: var(--ink); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.3); max-height: 60vh; overflow: auto; z-index: 1100; }
.results button { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 11px 14px; }
.results button:hover, .results button:focus-visible { background: var(--line); }
.results small { display: block; color: var(--muted); }
.results .label { padding: 8px 14px 4px; font-size: .75rem; color: var(--muted); }
.results .msg { padding: 12px 14px; color: var(--muted); }

/* ---------- map ---------- */
.mapwrap { position: relative; }
#map { height: 46vh; min-height: 280px; max-height: 520px; background: #233a52; }
.leaflet-container { font-family: var(--font); }
.layers { position: absolute; top: 10px; left: max(10px, env(safe-area-inset-left, 0px)); z-index: 500; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 70px); }
.layers button { border: 0; border-radius: 999px; padding: 5px 12px; font-size: .82rem; background: rgba(30,32,36,.78); color: #fff; backdrop-filter: blur(4px); }
.layers button[aria-pressed="true"] { background: #fff; color: #1f2328; font-weight: 600; }
.chips { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 64px; z-index: 500; display: grid; gap: 10px; }
.chip { display: flex; align-items: center; gap: 12px; color: #fff; font-size: 1rem; font-weight: 500; text-shadow: 0 1px 3px rgba(0,0,0,.7); background: none; border: 0; padding: 0; text-align: left; }
.chip .badge { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.35); text-shadow: none; flex: none; }
.chip .badge.warn { background: #c48a2c; }
.chip .badge.now { background: #f2a582; color: #1f2328; display: grid; grid-template-rows: 1fr auto; overflow: hidden; padding: 0; }
.chip .badge.now b { font-size: 1.25rem; font-weight: 600; align-self: center; }
.chip .badge.now small { background: #c9c7f2; width: 100%; text-align: center; font-size: .66rem; line-height: 1.5; }
.timebar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 500; display: flex; align-items: center; gap: 10px; padding: 8px max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px)); background: linear-gradient(transparent, rgba(0,0,0,.55)); color: #fff; }
.timebar button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: #fff; color: #222; display: grid; place-items: center; flex: none; }
.timebar input { flex: 1; min-width: 0; accent-color: #e5484d; }
.timebar .tl { font-size: .82rem; white-space: nowrap; min-width: 92px; text-align: right; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.scale { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: 54px; z-index: 500; display: grid; gap: 2px; font-size: .66rem; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.8); }
.scale .bar { width: 10px; height: 110px; border-radius: 5px; justify-self: end; }
.scale .ends { display: flex; flex-direction: column; justify-content: space-between; height: 110px; position: absolute; right: 16px; top: 16px; text-align: right; }
.maploading { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); z-index: 500; background: rgba(30,32,36,.8); color: #fff; border-radius: 999px; padding: 3px 12px; font-size: .78rem; }

/* ---------- day strip ---------- */
.days { background: var(--chrome); color: var(--chrome-ink); position: relative; }
.days-scroll { overflow-x: auto; scrollbar-width: none; }
.days-scroll::-webkit-scrollbar { display: none; }
.days-track { position: relative; }
.days-track svg.hills { position: absolute; left: 0; top: 0; pointer-events: none; }
.days-row { display: flex; position: relative; }
.day { flex: 0 0 var(--dw); width: var(--dw); background: none; border: 0; border-right: 1px solid #55595f; color: inherit; height: 150px; display: grid; grid-template-rows: auto 1fr auto; justify-items: center; padding: 10px 2px 12px; position: relative; }
.day .dn { font-size: .95rem; color: var(--chrome-ink); }
.day .dn small { display: block; font-size: .7rem; color: var(--chrome-muted); text-align: center; }
.day .ic { align-self: center; filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
.day .tt { font-size: 1.05rem; white-space: nowrap; }
.day .tt b { font-weight: 600; font-size: 1.15rem; }
.day[aria-selected="true"] { background: rgba(255,255,255,.07); }
.sel-rail { height: 22px; position: relative; background: #e9eaec; margin: 0 6px; border-radius: 11px; }
.sel-rail .knob { position: absolute; top: 2px; bottom: 2px; border: 3px solid var(--accent); border-radius: 11px; background: #fff; transition: left .2s; }
.drops { display: flex; height: 34px; align-items: center; }
.drops span { flex: 0 0 var(--dw); text-align: center; color: #dfe3e8; letter-spacing: -2px; font-size: .9rem; }
.drops span svg { margin: 0 1px; }
.fc-link { position: absolute; right: 0; bottom: 0; background: var(--accent); color: #fff; border: 0; border-radius: 16px 0 0 0; padding: 8px 16px; font-size: .9rem; font-weight: 500; display: flex; align-items: center; gap: 6px; }

/* ---------- table ---------- */
main { max-width: 1100px; margin: 0 auto; }
.tablebox { position: relative; overflow-x: auto; background: var(--bg); }
.tablebox svg.bgwave { position: absolute; top: 0; pointer-events: none; z-index: 0; }
table.fc { border-collapse: collapse; position: relative; z-index: 1; min-width: 100%; }
.fc th { position: sticky; left: 0; z-index: 3; background: var(--bg); text-align: right; font-weight: 400; color: var(--muted); font-size: .9rem; padding: 0 8px 0 10px; white-space: nowrap; height: 46px; }
.fc th .u { display: inline-block; min-width: 46px; text-align: center; color: var(--ink); text-decoration: underline dotted; text-underline-offset: 3px; margin-left: 6px; font-size: .9rem; }
.fc td { text-align: center; min-width: 58px; padding: 0 2px; height: 46px; font-variant-numeric: tabular-nums; white-space: nowrap; position: relative; }
.fc td.nt { background: color-mix(in srgb, var(--night) 75%, transparent); }
.dayhead { padding: 12px max(16px, env(safe-area-inset-left, 0px)) 4px; font-size: 1.2rem; font-weight: 500; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.dayhead .acc { font-size: .8rem; font-weight: 500; padding: 1px 10px 1px 2px; border-radius: 999px; background: var(--line); color: var(--ink); }
.dayhead .acc b { display: inline-block; background: #d4a72c; color: #fff; border-radius: 999px; padding: 0 8px; margin-right: 6px; }
.dayhead .sum { flex-basis: 100%; font-size: .85rem; font-weight: 400; color: var(--muted); }
.fc tr.hour td { color: var(--muted); font-size: 1.35rem; font-weight: 400; }
.fc tr.icon td { height: 60px; }
.fc tr.temp td { font-size: 1.5rem; font-weight: 500; }
.fc tr.feels td { color: var(--muted); font-size: 1.15rem; }
.fc tr.rain td { color: var(--rain); font-size: 1.15rem; font-weight: 500; }
.fc tr.wind td { font-size: 1.4rem; }
.fc tr.gust td { font-size: .95rem; }
.fc tr.gust td .g { position: absolute; inset: 9px 0; display: grid; place-items: center; }
.fc tr.warnrow td { height: 40px; }
.fc .warnband { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--warn); }
.fc .warntext { position: absolute; left: 4px; top: 8px; font-size: .88rem; color: var(--muted); white-space: nowrap; z-index: 2; display: flex; align-items: center; gap: 4px; }
.fc td.now::before { content: ""; position: absolute; inset: 0; border-left: 3px solid #f0c9c6; border-right: 3px solid #f0c9c6; pointer-events: none; }
.fc tr.hour td.now::before { border-top: 3px solid #f0c9c6; border-radius: 10px 10px 0 0; }
.fc tr:last-child td.now::before { border-bottom: 3px solid #f0c9c6; border-radius: 0 0 10px 10px; }
.fc td.now::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 2px dashed #f0b4b0; z-index: -1; }
.fc tr.hour td.now { color: var(--muted); }
.arrow { display: inline-block; }
.note { padding: 10px max(16px, env(safe-area-inset-left, 0px)); font-size: .78rem; color: var(--muted); display: grid; gap: 4px; }
.note a { color: inherit; }
.status { font-size: .85rem; color: var(--muted); padding: 6px max(16px, env(safe-area-inset-left, 0px)) 0; }
.status.err { color: var(--accent); }
.skeleton { height: 420px; background: linear-gradient(90deg, var(--bg), var(--line), var(--bg)); background-size: 200% 100%; }
@media (prefers-reduced-motion: no-preference) { .skeleton { animation: sh 1.4s linear infinite; } }
@keyframes sh { to { background-position: -200% 0; } }

/* ---------- bottom bar ---------- */
.bottombar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000; background: var(--bar); color: var(--bar-ink);
  display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: center;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.bb { display: flex; align-items: center; gap: 10px; min-width: 0; position: relative; }
.bb .lbl { font-size: .72rem; opacity: .85; line-height: 1.1; }
.bb select { appearance: none; -webkit-appearance: none; background: transparent; border: 0; color: #fff; font-size: 1.15rem; font-weight: 500; padding: 0 22px 0 0; max-width: 100%; }
.bb select option { color: #1f2328; }
.bb .chev { position: absolute; right: 0; bottom: 6px; pointer-events: none; }
.bb .stack { display: grid; min-width: 0; position: relative; }
.sharebtn { background: none; border: 0; color: #fff; padding: 6px; }
@media (max-width: 520px) {
  .search input { font-size: 1.4rem; }
  .fc th { font-size: .7rem; padding: 0 2px 0 8px; }
  .fc th .u { min-width: 26px; font-size: .7rem; margin-left: 2px; }
  .fc td { min-width: 34px; padding: 0 1px; }
  .fc tr.hour td { font-size: 1rem; }
  .fc tr.icon td { height: 48px; }
  .fc tr.icon svg { width: 34px; height: 34px; }
  .fc tr.temp td { font-size: 1.05rem; }
  .fc tr.feels td, .fc tr.rain td { font-size: .85rem; }
  .fc tr.wind td { font-size: 1rem; }
  .fc tr.gust td { font-size: .8rem; }
  .fc tr.dir svg { width: 18px; height: 20px; }
  .fc .warntext { font-size: .72rem; }
  .day .tt { font-size: .92rem; }
  .day .tt b { font-size: 1rem; }
  .bb select { font-size: 1rem; }
}
</style>
</head>
<body>

<header class="top">
  <div class="searchrow">
    <div class="search">
      <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.8" fill="none" stroke="currentColor" stroke-width="2.3"/><path d="M15.2 15.2 21 21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="ค้นหาตำบล อำเภอ จังหวัด" autocomplete="off" aria-label="ค้นหาสถานที่">
      <div class="results" id="results" hidden></div>
    </div>
    <button class="iconbtn" id="btn-gps" type="button" aria-label="ใช้ตำแหน่งปัจจุบัน">
      <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.8" fill="currentColor"/><path d="M12 1.5v3.5M12 19v3.5M1.5 12H5M19 12h3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button class="iconbtn" id="btn-fav" type="button" aria-label="บันทึกเป็นสถานที่โปรด" aria-pressed="false">
      <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.2-9.4C1.6 7.6 4 4.2 7.4 4.2c2 0 3.6 1.1 4.6 2.7 1-1.6 2.6-2.7 4.6-2.7 3.4 0 5.8 3.4 4.6 6.9-1.7 4.8-9.2 9.4-9.2 9.4z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>

<div class="mapwrap">
  <div id="map" role="application" aria-label="แผนที่สภาพอากาศ แตะเพื่อดูพยากรณ์ตรงจุดนั้น"></div>
  <div class="layers" role="group" aria-label="ชั้นข้อมูลแผนที่">
    <button type="button" data-layer="rain" aria-pressed="true">ฝนและเมฆ</button>
    <button type="button" data-layer="temp" aria-pressed="false">อุณหภูมิ</button>
    <button type="button" data-layer="wind" aria-pressed="false">ลม</button>
  </div>
  <div class="scale" id="scale"></div>
  <div class="maploading" id="maploading" hidden>กำลังโหลดแผนที่สภาพอากาศ…</div>
  <div class="chips">
    <button class="chip" id="chip-warn" type="button" hidden><span class="badge warn"><svg width="34" height="30" viewBox="0 0 34 30" aria-hidden="true"><path d="M7 4l-4 8.5a4.3 4.3 0 1 0 8 0z M17 2l-4 8.5a4.3 4.3 0 1 0 8 0z M27 4l-4 8.5a4.3 4.3 0 1 0 8 0z" fill="#fff" transform="translate(0 6)"/></svg></span><span id="warn-text">เตือนสภาพอากาศ</span></button>
    <div class="chip" id="chip-now" hidden><span class="badge now"><b id="now-temp">–</b><small id="now-wind">–</small></span><span id="now-text">สภาพอากาศตอนนี้</span></div>
  </div>
  <div class="timebar">
    <button type="button" id="play" aria-label="เล่นแผนที่ตามเวลา">▶</button>
    <input type="range" id="tslider" min="0" max="47" step="1" value="0" aria-label="เวลาบนแผนที่">
    <span class="tl" id="tlabel">–</span>
  </div>
</div>

<nav class="days" aria-label="เลือกวัน">
  <div class="days-scroll" id="days-scroll">
    <div class="days-track" id="days-track">
      <div class="days-row" id="days" role="tablist"></div>
      <div class="sel-rail" id="rail"><div class="knob" id="knob"></div></div>
      <div class="drops" id="drops"></div>
    </div>
  </div>
  <button class="fc-link" type="button" id="btn-next">พยากรณ์อากาศ 16 วัน
    <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="3"/></svg></button>
</nav>

<main>
  <div class="dayhead" id="dayhead"></div>
  <div class="tablebox" id="tablebox"><div class="skeleton"></div></div>
  <div class="status" id="status" role="status"></div>
  <div class="note">
    <span>ฝน = ปริมาณสะสมในช่วงเวลาก่อนหน้า (มม.) · ลมกระโชก = แรงสุดในช่วงนั้น · คำเตือนฝนหนักเมื่อฝนเกิน 10 มม. ใน 3 ชั่วโมง</span>
    <span>ข้อมูลพยากรณ์จาก <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · แผนที่ © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>, CARTO · แตะบนแผนที่เพื่อดูพยากรณ์ตรงจุดนั้น</span>
  </div>
</main>

<footer class="bottombar">
  <label class="bb">
    <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span class="stack"><span class="lbl">การพยากรณ์</span>
      <select id="sel-step" aria-label="ช่วงเวลาในตาราง"><option value="3">3 ชั่วโมง</option><option value="1">1 ชั่วโมง</option></select>
      <svg class="chev" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8l7 7 7-7" fill="none" stroke="currentColor" stroke-width="3"/></svg></span>
  </label>
  <label class="bb">
    <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5z M2 12l10 5 10-5 M2 16l10 5 10-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
    <span class="stack"><span class="lbl">แหล่งข้อมูล</span>
      <select id="sel-model" aria-label="แบบจำลองพยากรณ์">
        <option value="best_match">อัตโนมัติ</option>
        <option value="ecmwf_ifs025">ECMWF</option>
        <option value="gfs_seamless">GFS</option>
        <option value="icon_seamless">ICON</option>
      </select>
      <svg class="chev" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8l7 7 7-7" fill="none" stroke="currentColor" stroke-width="3"/></svg></span>
  </label>
  <button class="sharebtn" id="btn-share" type="button" aria-label="แชร์">
    <svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M4 13v7h16v-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const DAY_SHORT = ["อา", "จ", "อ", "พ", "พฤ", "ศ", "ส"];
  const DAY_FULL = ["วันอาทิตย์", "วันจันทร์", "วันอังคาร", "วันพุธ", "วันพฤหัสบดี", "วันศุกร์", "วันเสาร์"];
  const MON = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
  const DW = 86;                      // day column width in px
  const DEFAULT_PLACE = { name: "หาดใหญ่", detail: "สงขลา", lat: 7.0084, lon: 100.4747 };
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (_) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} },
  };
  document.documentElement.style.setProperty("--dw", DW + "px");

  let place = store.get("wx-place", DEFAULT_PLACE);
  let favs = store.get("wx-favs", []);
  let step = Number(store.get("wx-step", 3));
  let model = store.get("wx-model", "best_match");
  let layer = store.get("wx-layer", "rain");
  let fc = null, selDay = 0;
  let map = null, marker = null;
  $("sel-step").value = String(step);
  $("sel-model").value = model;

  // ---------- weather codes (WMO) ----------
  function codeInfo(c) {
    if (c === 0) return { t: "ท้องฟ้าแจ่มใส", k: "clear" };
    if (c === 1) return { t: "มีเมฆเล็กน้อย", k: "mostly" };
    if (c === 2) return { t: "มีเมฆบางส่วน", k: "partly" };
    if (c === 3) return { t: "เมฆมาก", k: "cloudy" };
    if (c === 45 || c === 48) return { t: "มีหมอก", k: "fog" };
    if (c >= 51 && c <= 57) return { t: "ฝนปรอย", k: "drizzle" };
    if (c === 61 || c === 80) return { t: "ฝนเล็กน้อย", k: "rain" };
    if (c === 63 || c === 81) return { t: "ฝนปานกลาง", k: "rain" };
    if (c === 65 || c === 82) return { t: "ฝนหนัก", k: "heavy" };
    if (c === 66 || c === 67) return { t: "ฝนเยือกแข็ง", k: "rain" };
    if ((c >= 71 && c <= 77) || c === 85 || c === 86) return { t: "หิมะ", k: "rain" };
    if (c === 95) return { t: "พายุฝนฟ้าคะนอง", k: "storm" };
    if (c === 96 || c === 99) return { t: "พายุฝนฟ้าคะนอง มีลูกเห็บ", k: "storm" };
    return { t: "–", k: "cloudy" };
  }

  // ---------- icons ----------
  function icon(code, isDay, size) {
    const k = codeInfo(code).k, s = size || 48;
    const sun = '<circle cx="15" cy="14" r="6" fill="var(--sun)"/><g stroke="var(--sun)" stroke-width="2.2" stroke-linecap="round"><path d="M15 3v2.5M15 22.5V25M4 14h2.5M23.5 14H26M7.2 6.2l1.8 1.8M21 20l1.8 1.8M22.8 6.2 21 8M9 20l-1.8 1.8"/></g>';
    const moon = '<path d="M17 4.5a9 9 0 1 0 8.5 12A7.5 7.5 0 0 1 17 4.5z" fill="none" stroke="var(--moon)" stroke-width="2"/>';
    const cloud = (fill, dx, dy) => '<path transform="translate(' + dx + ' ' + dy + ')" d="M13 34h21a7 7 0 0 0 0-14 9.5 9.5 0 0 0-18.2 2.6A5.8 5.8 0 0 0 13 34z" fill="' + fill + '"/>';
    const drop = (x) => '<path d="M' + x + ' 37l-3 6a3.1 3.1 0 1 0 6 0z" fill="#3b8be0"/>';
    const bolt = '<path d="M30 34l-5.5 8h4.3l-2.2 7 7.6-9.6h-4.5l2.6-5.4z" fill="var(--bolt)" stroke="#fff" stroke-width=".8"/>';
    const orb = isDay ? sun : moon;
    let b = "";
    switch (k) {
      case "clear": b = isDay ? '<g transform="translate(9 10) scale(1.1)">' + sun + "</g>" : '<g transform="translate(6 7) scale(1.25)">' + moon + "</g>"; break;
      case "mostly": b = orb + cloud("var(--cloud)", 6, 5); break;
      case "partly": b = orb + cloud("var(--cloud)", 3, 1); break;
      case "cloudy": b = cloud("var(--cloud-2)", 5, -6) + cloud("var(--cloud)", -2, 0); break;
      case "fog": b = cloud("var(--cloud)", 0, -4) + '<g stroke="var(--cloud-2)" stroke-width="2.4" stroke-linecap="round"><path d="M10 38h26M14 43h22"/></g>'; break;
      case "drizzle": b = orb + cloud("var(--cloud)", 0, -4) + drop(20); break;
      case "rain": b = cloud("var(--cloud-2)", 5, -9) + cloud("var(--cloud)", -2, -4) + drop(17) + drop(26); break;
      case "heavy": b = cloud("var(--cloud-2)", 5, -9) + cloud("var(--cloud)", -2, -4) + drop(14) + drop(22) + drop(30); break;
      case "storm": b = cloud("var(--cloud-2)", 5, -9) + cloud("var(--cloud)", -2, -4) + drop(18) + bolt; break;
    }
    return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 48 50" aria-hidden="true">' + b + "</svg>";
  }
  const dropSvg = '<svg width="11" height="15" viewBox="0 0 10 14" aria-hidden="true"><path d="M5 0 1 7.5a4.2 4.2 0 1 0 8 0z" fill="currentColor"/></svg>';

  // ---------- colour scales ----------
  function lerpColor(stops, v) {
    if (v <= stops[0][0]) return stops[0][1];
    for (let i = 1; i < stops.length; i++) {
      if (v <= stops[i][0]) {
        const [a, ca] = stops[i - 1], [b, cb] = stops[i], t = (v - a) / (b - a);
        return ca.map((x, k) => x + (cb[k] - x) * t);
      }
    }
    return stops[stops.length - 1][1];
  }
  const SCALES = {
    rain: { unit: "มม./ชม.", lo: "0", hi: "20+", stops: [[0, [0, 0, 0, 0]], [0.1, [120, 200, 255, 150]], [1, [40, 140, 255, 200]], [3, [40, 80, 230, 215]], [8, [120, 60, 220, 225]], [15, [200, 50, 190, 230]], [30, [240, 50, 60, 235]]] },
    cloud: { stops: [[0, [255, 255, 255, 0]], [30, [235, 240, 248, 40]], [70, [215, 222, 235, 120]], [100, [200, 208, 222, 175]]] },
    temp: { unit: "°C", lo: "10°", hi: "38°", stops: [[10, [80, 60, 200, 190]], [16, [60, 130, 230, 190]], [21, [60, 190, 200, 190]], [25, [90, 200, 110, 190]], [28, [200, 220, 70, 195]], [31, [250, 185, 50, 200]], [34, [240, 110, 40, 205]], [38, [200, 30, 60, 210]]] },
    wind: { unit: "km/h", lo: "0", hi: "60+", stops: [[0, [70, 110, 200, 120]], [8, [70, 170, 220, 150]], [16, [80, 200, 140, 170]], [25, [210, 220, 70, 190]], [35, [245, 160, 40, 205]], [50, [230, 70, 50, 215]], [65, [170, 30, 120, 220]]] },
  };
  function gustStyle(v) {
    const c = lerpColor(SCALES.wind.stops, v);
    if (v < 10) return "";
    return "background:rgba(" + c.slice(0, 3).map(Math.round).join(",") + ",.9);color:" + (v >= 45 ? "#fff" : "#13222a");
  }

  // ---------- forecast for the chosen place ----------
  async function loadForecast() {
    setStatus("");
    const p = new URLSearchParams({
      latitude: place.lat.toFixed(4), longitude: place.lon.toFixed(4), timezone: "auto", forecast_days: "16", wind_speed_unit: "kmh", models: model,
      hourly: "temperature_2m,apparent_temperature,precipitation,precipitation_probability,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m,is_day",
      daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_gusts_10m_max",
      current: "temperature_2m,weather_code,wind_speed_10m,precipitation,is_day",
    });
    try {
      const r = await fetch("https://api.open-meteo.com/v1/forecast?" + p);
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      if (!j.hourly || !j.daily) throw new Error("no data");
      fc = j;
      store.set("wx-cache", { place, model, fc, at: Date.now() });
      setStatus("อัปเดตล่าสุด " + new Date().toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" }) + " น.");
    } catch (e) {
      const c = store.get("wx-cache", null);
      if (c && c.place && c.place.lat === place.lat && c.place.lon === place.lon) {
        fc = c.fc;
        setStatus("ออฟไลน์อยู่ แสดงข้อมูลที่บันทึกไว้เมื่อ " + new Date(c.at).toLocaleString("th-TH"));
      } else {
        fc = null;
        setStatus("โหลดพยากรณ์ไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่" + (model !== "best_match" ? " หรือเปลี่ยนแหล่งข้อมูลเป็นอัตโนมัติ" : ""), true);
      }
    }
    render();
  }
  function setStatus(t, err) { $("status").textContent = t; $("status").className = "status" + (err ? " err" : ""); }

  function parseLocal(s) { const [d, t] = s.split("T"); const [y, m, dd] = d.split("-").map(Number); return { y, m, d: dd, h: t ? Number(t.slice(0, 2)) : 0, date: new Date(y, m - 1, dd) }; }

  function render() {
    renderHeader();
    if (!fc) { $("tablebox").innerHTML = ""; $("days").innerHTML = ""; $("drops").innerHTML = ""; return; }
    renderNow();
    renderDays();
    renderTable();
  }

  function renderHeader() {
    if (document.activeElement !== $("q")) $("q").value = place.name;
    const isFav = favs.some((f) => f.lat === place.lat && f.lon === place.lon);
    $("btn-fav").setAttribute("aria-pressed", String(isFav));
    $("btn-fav").setAttribute("aria-label", isFav ? "ลบออกจากสถานที่โปรด" : "บันทึกเป็นสถานที่โปรด");
    document.title = place.name + " · ฟ้าฝนวันนี้";
  }

  function renderNow() {
    const c = fc.current;
    if (c) {
      $("chip-now").hidden = false;
      $("now-temp").textContent = Math.round(c.temperature_2m) + "°";
      $("now-wind").textContent = Math.round(c.wind_speed_10m) + "km/h";
      $("now-text").textContent = codeInfo(c.weather_code).t;
    }
    // warning: heavy rain or thunder in the next 48 h
    const h = fc.hourly, start = nowIndex();
    let warn = null;
    for (let i = start; i < Math.min(h.time.length, start + 48); i++) {
      let r3 = 0; for (let j = Math.max(0, i - 2); j <= i; j++) r3 += h.precipitation[j] || 0;
      if (r3 >= 10 || h.weather_code[i] >= 95 || h.wind_gusts_10m[i] >= 50) { warn = { i, kind: r3 >= 10 ? "ฝนหนัก" : h.weather_code[i] >= 95 ? "พายุฝนฟ้าคะนอง" : "ลมแรง" }; break; }
    }
    $("chip-warn").hidden = !warn;
    if (warn) {
      const p = parseLocal(h.time[warn.i]);
      $("warn-text").textContent = "เตือน" + warn.kind + " " + (p.date.toDateString() === new Date().toDateString() ? "วันนี้" : DAY_FULL[p.date.getDay()]) + " " + String(p.h).padStart(2, "0") + ":00";
      $("chip-warn").onclick = () => { const di = fc.daily.time.indexOf(h.time[warn.i].slice(0, 10)); if (di >= 0) { selDay = di; renderDays(); renderTable(); $("tablebox").scrollIntoView({ behavior: "smooth" }); } };
    }
  }

  function nowIndex() {
    const h = fc.hourly;
    if (fc.current) { const k = fc.current.time.slice(0, 13) + ":00"; const i = h.time.indexOf(k); if (i >= 0) return i; }
    return 0;
  }

  function renderDays() {
    const d = fc.daily, h = fc.hourly, n = d.time.length;
    const row = $("days");
    row.textContent = "";
    d.time.forEach((t, i) => {
      const p = parseLocal(t);
      const b = document.createElement("button");
      b.className = "day"; b.type = "button"; b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(i === selDay));
      b.innerHTML =
        '<span class="dn">' + (i === 0 ? "วันนี้" : DAY_SHORT[p.date.getDay()]) + "<small>" + p.d + " " + MON[p.m - 1] + "</small></span>" +
        '<span class="ic">' + icon(d.weather_code[i], 1, 46) + "</span>" +
        '<span class="tt tnum">' + Math.round(d.temperature_2m_min[i]) + "° / <b>" + Math.round(d.temperature_2m_max[i]) + "°</b></span>";
      b.setAttribute("aria-label", DAY_FULL[p.date.getDay()] + " " + p.d + " " + MON[p.m - 1] + " ฝน " + d.precipitation_sum[i].toFixed(1) + " มม.");
      b.onclick = () => { selDay = i; renderDays(); renderTable(); };
      row.appendChild(b);
    });
    // temperature hills behind the day row
    const W = n * DW, H = 150;
    let lo = Infinity, hi = -Infinity;
    h.temperature_2m.forEach((v) => { if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } });
    const span = Math.max(4, hi - lo);
    const pts = [];
    for (let i = 0; i < Math.min(h.time.length, n * 24); i++) {
      const v = h.temperature_2m[i]; if (v == null) continue;
      pts.push([(i / 24) * DW, H - 18 - ((v - lo) / span) * 70]);
    }
    let path = "M0 " + H + " L" + pts.map((q) => q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" L") + " L" + W + " " + H + " Z";
    const svg = '<svg class="hills" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H + '"><defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9b8d4" stop-opacity=".95"/><stop offset="1" stop-color="#6d5f78" stop-opacity=".25"/></linearGradient></defs><path d="' + path + '" fill="url(#hg)"/></svg>';
    const track = $("days-track");
    const old = track.querySelector("svg.hills"); if (old) old.remove();
    track.insertAdjacentHTML("afterbegin", svg);
    track.style.width = W + "px";
    // rain drops row
    $("drops").innerHTML = d.precipitation_sum.map((r) => {
      const k = r < 0.5 ? 0 : r < 3 ? 1 : r < 10 ? 2 : r < 25 ? 3 : 4;
      return "<span>" + dropSvg.repeat(k) + "</span>";
    }).join("");
    // selection knob
    const knob = $("knob");
    knob.style.left = (selDay * DW + 4) + "px";
    knob.style.width = (DW - 8) + "px";
    const sc = $("days-scroll");
    const target = selDay * DW - sc.clientWidth / 2 + DW / 2;
    sc.scrollTo({ left: Math.max(0, target), behavior: "smooth" });
  }
  $("btn-next").onclick = () => { if (!fc) return; selDay = Math.min(fc.daily.time.length - 1, selDay + 1); renderDays(); renderTable(); };
  $("rail").addEventListener("click", (e) => {
    if (!fc) return;
    const r = $("days-track").getBoundingClientRect();
    const i = Math.floor((e.clientX - r.left) / DW);
    if (i >= 0 && i < fc.daily.time.length) { selDay = i; renderDays(); renderTable(); }
  });

  function renderTable() {
    const h = fc.hourly, d = fc.daily;
    const dayStr = d.time[selDay], pd = parseLocal(dayStr);
    const idx = new Map(h.time.map((t, i) => [t, i]));
    const hours = step === 3 ? [1, 4, 7, 10, 13, 16, 19, 22] : Array.from({ length: 24 }, (_, i) => i);
    const cols = hours.map((hr) => {
      const i = idx.get(dayStr + "T" + String(hr).padStart(2, "0") + ":00");
      if (i == null) return null;
      let rain = 0, gust = 0, prob = 0;
      for (let j = Math.max(0, i - step + 1); j <= i; j++) {
        rain += h.precipitation[j] || 0;
        gust = Math.max(gust, h.wind_gusts_10m[j] || 0);
        prob = Math.max(prob, h.precipitation_probability ? (h.precipitation_probability[j] || 0) : 0);
      }
      return { hr, i, rain, gust, prob, t: h.temperature_2m[i], feels: h.apparent_temperature[i], code: h.weather_code[i], day: h.is_day[i], wind: h.wind_speed_10m[i], dir: h.wind_direction_10m[i] };
    }).filter(Boolean);

    const ni = nowIndex();
    let nowCol = -1;
    cols.forEach((c, k) => { if (ni > c.i - step && ni <= c.i) nowCol = k; });

    const cell = (c, k, html, extra) => '<td class="' + (c.day ? "" : "nt") + (k === nowCol ? " now" : "") + (extra || "") + '">' + html + "</td>";
    const row = (cls, label, unit, f) => '<tr class="' + cls + '"><th scope="row">' + label + (unit != null ? '<span class="u">' + unit + "</span>" : "") + "</th>" + cols.map((c, k) => cell(c, k, f(c, k))).join("") + "</tr>";
    const prob = d.precipitation_probability_max ? d.precipitation_probability_max[selDay] : null;

    // warning band: contiguous runs of risky columns
    const risky = cols.map((c) => c.rain >= 10 * (step / 3) ? "ฝนหนัก" : c.code >= 95 ? "ฟ้าคะนอง" : c.gust >= 50 ? "ลมแรง" : "");
    const firstRisk = risky.findIndex(Boolean);
    const warnRow = '<tr class="warnrow"><th scope="row">คำเตือน<span class="u"><svg width="18" height="16" viewBox="0 0 24 22" aria-hidden="true"><path d="M12 1 23 21H1z" fill="currentColor"/><path d="M12 8v6M12 16.5v1.5" stroke="var(--bg)" stroke-width="2.2"/></svg></span></th>' +
      cols.map((c, k) => cell(c, k, (k === firstRisk ? '<span class="warntext"><svg width="20" height="14" viewBox="0 0 34 24" aria-hidden="true"><path d="M7 4l-4 8.5a4.3 4.3 0 1 0 8 0z M17 2l-4 8.5a4.3 4.3 0 1 0 8 0z M27 4l-4 8.5a4.3 4.3 0 1 0 8 0z" fill="currentColor"/></svg>' + risky[k] + "</span>" : "") + (risky[k] ? '<span class="warnband"></span>' : ""))).join("") + "</tr>";

    const headDay = (selDay === 0 ? "วันนี้ · " : "") + DAY_FULL[pd.date.getDay()] + " " + pd.d + " " + MON[pd.m - 1];
    const html =
      '<table class="fc">' +
      row("hour", "ชั่วโมง", '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2"/></svg>', (c) => c.hr) +
      row("icon", "", null, (c) => '<span title="' + codeInfo(c.code).t + '">' + icon(c.code, c.day, step === 1 ? 40 : 50) + "</span>") +
      row("temp", "อุณหภูมิ", "°C", (c) => Math.round(c.t) + "°") +
      row("feels", "รู้สึกเหมือน", "°C", (c) => Math.round(c.feels) + "°") +
      row("rain", "ฝน", "มม.", (c) => (c.rain >= 0.05 ? c.rain.toFixed(1) : "")) +
      row("prob", "โอกาสฝน", "%", (c) => (c.prob >= 10 ? c.prob : "")) +
      row("wind", "ลม", "km/h", (c) => Math.round(c.wind)) +
      row("gust", "ลมกระโชก", "km/h", (c) => '<span class="g" style="' + gustStyle(c.gust) + '">' + Math.round(c.gust) + "</span>") +
      row("dir", "ทิศทางลม", '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 22V3M5 4h12l-3 4 3 4H5" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>', (c) => '<span class="arrow" title="ลมพัดมาจาก ' + Math.round(c.dir) + '°" style="transform:rotate(' + (c.dir + 180) + 'deg)"><svg width="24" height="26" viewBox="0 0 20 22" aria-hidden="true"><path d="M10 1 17 10h-4.5v11h-5V10H3z" fill="#5c7fb0"/></svg></span>') +
      warnRow +
      "</table>";
    const box = $("tablebox");
    box.innerHTML = html;
    const gmax = d.wind_gusts_10m_max ? d.wind_gusts_10m_max[selDay] : null;
    $("dayhead").innerHTML = "<span>" + headDay + "</span>" + (prob != null ? '<span class="acc"><b>' + prob + '%</b>โอกาสฝน</span>' : "") +
      '<span class="sum">' + codeInfo(d.weather_code[selDay]).t + " · " + Math.round(d.temperature_2m_min[selDay]) + "–" + Math.round(d.temperature_2m_max[selDay]) + "°C · ฝนทั้งวัน " + (d.precipitation_sum[selDay] || 0).toFixed(1) + " มม." + (gmax != null ? " · ลมกระโชกสูงสุด " + Math.round(gmax) + " km/h" : "") + (selDay >= 7 ? " · พยากรณ์ล่วงหน้าไกล ความแม่นยำลดลง" : "") + "</span>";
    drawWave(box, cols);
    // tap a column → move the map to that time when it is within the map window
    box.querySelectorAll("tr.hour td").forEach((td, k) => {
      td.style.cursor = "pointer";
      td.onclick = () => setMapTimeByIndex(cols[k].i);
    });
    if (nowCol > 0) { const cellEl = box.querySelector("tr.hour td.now"); if (cellEl) box.scrollLeft = Math.max(0, cellEl.offsetLeft - 160); }
    else box.scrollLeft = 0;
  }

  // soft temperature + rain areas behind the table, like a forecast meteogram
  function drawWave(box, cols) {
    const tds = box.querySelectorAll("tr.temp td");
    if (!tds.length) return;
    const table = box.querySelector("table");
    const x0 = tds[0].offsetLeft, W = table.offsetWidth, H = table.offsetHeight;
    const tempRow = box.querySelector("tr.temp"), rainRow = box.querySelector("tr.rain");
    const xs = Array.from(tds).map((td) => td.offsetLeft + td.offsetWidth / 2);
    const ts = cols.map((c) => c.t);
    const lo = Math.min(...ts), hi = Math.max(...ts), sp = Math.max(3, hi - lo);
    const yTop = tempRow.offsetTop - 60, yBase = rainRow.offsetTop;
    const ty = (v) => yBase - ((v - lo) / sp) * (yBase - yTop - 10) - 6;
    const smooth = (pts) => {
      let p = "M" + pts[0][0] + " " + pts[0][1];
      for (let i = 1; i < pts.length; i++) { const [xa, ya] = pts[i - 1], [xb, yb] = pts[i], mx = (xa + xb) / 2; p += " C" + mx + " " + ya + " " + mx + " " + yb + " " + xb + " " + yb; }
      return p;
    };
    const tp = [[x0, ty(ts[0])]].concat(xs.map((x, i) => [x, ty(ts[i])])).concat([[W, ty(ts[ts.length - 1])]]);
    const temp = smooth(tp) + " L" + W + " " + yBase + " L" + x0 + " " + yBase + " Z";
    const rmax = Math.max(4, ...cols.map((c) => c.rain));
    const rb = rainRow.offsetTop + rainRow.offsetHeight, rh = rainRow.offsetHeight + 16;
    const rp = [[x0, rb - (cols[0].rain / rmax) * rh]].concat(xs.map((x, i) => [x, rb - (cols[i].rain / rmax) * rh])).concat([[W, rb - (cols[cols.length - 1].rain / rmax) * rh]]);
    const rain = smooth(rp) + " L" + W + " " + rb + " L" + x0 + " " + rb + " Z";
    box.insertAdjacentHTML("afterbegin", '<svg class="bgwave" width="' + W + '" height="' + H + '" style="left:0"><path d="' + temp + '" fill="var(--temp-fill)" opacity=".75"/><path d="' + rain + '" fill="var(--rain-fill)" opacity=".9"/></svg>');
  }

  // ---------- place handling ----------
  function setPlace(p, opts) {
    place = { name: p.name, detail: p.detail || "", lat: Math.round(p.lat * 10000) / 10000, lon: Math.round(p.lon * 10000) / 10000 };
    store.set("wx-place", place);
    selDay = 0;
    hideResults();
    $("q").blur();
    if (map) {
      marker.setLatLng([place.lat, place.lon]);
      if (!opts || !opts.keepView) map.setView([place.lat, place.lon], Math.max(map.getZoom(), 7));
    }
    loadForecast();
  }

  async function reverseName(lat, lon) {
    try {
      const r = await fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&accept-language=th&lat=" + lat + "&lon=" + lon);
      const j = await r.json();
      const a = j.address || {};
      const name = a.village || a.hamlet || a.suburb || a.quarter || a.town || a.city_district || a.city || a.county || j.name;
      const detail = [a.county || a.district, a.state || a.province].filter(Boolean).filter((x) => x !== name).join(", ");
      if (name) return { name, detail };
    } catch (_) {}
    return { name: lat.toFixed(3) + ", " + lon.toFixed(3), detail: "" };
  }

  let searchTimer = null, searchSeq = 0;
  function hideResults() { $("results").hidden = true; }
  function showResults(items, msg) {
    const box = $("results");
    box.textContent = "";
    if (msg) { const m = document.createElement("div"); m.className = "msg"; m.textContent = msg; box.appendChild(m); }
    let lastGroup = null;
    items.forEach((it) => {
      if (it.group && it.group !== lastGroup) { const l = document.createElement("div"); l.className = "label"; l.textContent = it.group; box.appendChild(l); lastGroup = it.group; }
      const b = document.createElement("button");
      b.type = "button"; b.textContent = it.name;
      if (it.detail) { const s = document.createElement("small"); s.textContent = it.detail; b.appendChild(s); }
      b.onclick = () => setPlace(it);
      box.appendChild(b);
    });
    box.hidden = !items.length && !msg;
  }
  const favItems = () => favs.map((f) => ({ ...f, group: "สถานที่โปรด" }));
  async function search(q) {
    const seq = ++searchSeq;
    if (q.length < 2) { showResults(favItems()); return; }
    showResults([], "กำลังค้นหา…");
    const out = [], seen = new Set();
    const push = (it) => { const k = it.lat.toFixed(2) + "," + it.lon.toFixed(2); if (!seen.has(k)) { seen.add(k); out.push(it); } };
    const nm = fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=7&accept-language=th&q=" + encodeURIComponent(q))
      .then((r) => r.json()).then((j) => (j || []).map((x) => { const a = x.address || {}; return { name: x.name || x.display_name.split(",")[0], detail: [a.county || a.district, a.state || a.province, a.country].filter(Boolean).join(", "), lat: Number(x.lat), lon: Number(x.lon) }; })).catch(() => []);
    const om = fetch("https://geocoding-api.open-meteo.com/v1/search?count=6&language=th&format=json&name=" + encodeURIComponent(q))
      .then((r) => r.json()).then((j) => (j.results || []).map((x) => ({ name: x.name, detail: [x.admin2, x.admin1, x.country].filter(Boolean).join(", "), lat: x.latitude, lon: x.longitude }))).catch(() => []);
    const [a, b] = await Promise.all([nm, om]);
    if (seq !== searchSeq) return;
    a.forEach(push); b.forEach(push);
    showResults(out, out.length ? "" : "ไม่พบ \"" + q + "\" ลองพิมพ์ชื่ออำเภอหรือจังหวัด หรือแตะบนแผนที่แทน");
  }
  $("q").addEventListener("input", (e) => { clearTimeout(searchTimer); const v = e.target.value.trim(); searchTimer = setTimeout(() => search(v), 350); });
  $("q").addEventListener("focus", (e) => { e.target.select(); showResults(favItems()); });
  $("q").addEventListener("keydown", (e) => {
    if (e.key === "Escape") { hideResults(); e.target.value = place.name; e.target.blur(); }
    if (e.key === "Enter") { clearTimeout(searchTimer); search(e.target.value.trim()); }
  });
  document.addEventListener("click", (e) => { if (!e.target.closest(".search")) { hideResults(); if (document.activeElement !== $("q")) $("q").value = place.name; } });

  $("btn-gps").onclick = () => {
    if (!navigator.geolocation) { setStatus("อุปกรณ์นี้ไม่รองรับการหาตำแหน่ง", true); return; }
    setStatus("กำลังหาตำแหน่งของคุณ…");
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const { latitude: lat, longitude: lon } = pos.coords;
      const n = await reverseName(lat, lon);
      setPlace({ ...n, lat, lon });
    }, () => setStatus("หาตำแหน่งไม่ได้ ตรวจสอบว่าอนุญาตให้ Safari ใช้ตำแหน่งแล้ว", true), { timeout: 15000, maximumAge: 600000 });
  };
  $("btn-fav").onclick = () => {
    const i = favs.findIndex((f) => f.lat === place.lat && f.lon === place.lon);
    if (i >= 0) favs.splice(i, 1); else favs.unshift({ name: place.name, detail: place.detail, lat: place.lat, lon: place.lon });
    favs = favs.slice(0, 12);
    store.set("wx-favs", favs);
    renderHeader();
  };
  $("sel-step").onchange = (e) => { step = Number(e.target.value); store.set("wx-step", step); if (fc) renderTable(); };
  $("sel-model").onchange = (e) => { model = e.target.value; store.set("wx-model", model); loadForecast(); };
  $("btn-share").onclick = async () => {
    const text = place.name + ": " + (fc && fc.current ? Math.round(fc.current.temperature_2m) + "° " + codeInfo(fc.current.weather_code).t : "พยากรณ์อากาศ");
    try { if (navigator.share) { await navigator.share({ title: "ฟ้าฝนวันนี้", text, url: location.href }); return; } } catch (_) { return; }
    try { await navigator.clipboard.writeText(location.href); setStatus("คัดลอกลิงก์แล้ว"); } catch (_) { setStatus(location.href); }
  };

  // ---------- map with a colour weather field ----------
  const GRID = 13;                    // GRID × GRID points per map fetch
  let field = null;                   // {bounds, n, times, rain[], cloud[], temp[], wind[]}
  let overlay = null, tIndex = 0, playTimer = null, fieldSeq = 0;

  function initMap() {
    if (!window.L) { $("map").innerHTML = '<p style="color:#fff;padding:16px">โหลดแผนที่ไม่ได้</p>'; return; }
    map = L.map("map", { zoomControl: false, attributionControl: false, worldCopyJump: true, minZoom: 4, maxZoom: 12 }).setView([place.lat, place.lon], 6);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png", { subdomains: "abcd", maxZoom: 18 }).addTo(map);
    map.createPane("labels");
    map.getPane("labels").style.zIndex = 450;
    map.getPane("labels").style.pointerEvents = "none";
    L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png", { subdomains: "abcd", maxZoom: 18, pane: "labels" }).addTo(map);
    L.control.attribution({ position: "topright", prefix: false }).addAttribution("© OSM © CARTO · Open-Meteo").addTo(map);
    marker = L.circleMarker([place.lat, place.lon], { radius: 9, color: "#ffffff", weight: 3, opacity: .6, fillColor: "#ffffff", fillOpacity: 1, pane: "markerPane" }).addTo(map);
    map.on("click", async (e) => {
      const { lat, lng } = e.latlng.wrap();
      marker.setLatLng([lat, lng]);
      const n = await reverseName(lat, lng);
      setPlace({ ...n, lat, lon: lng }, { keepView: true });
    });
    let mt = null;
    map.on("moveend", () => { clearTimeout(mt); mt = setTimeout(() => ensureField(false), 400); });
    ensureField(true);
    setInterval(() => ensureField(true), 30 * 60 * 1000);
  }

  async function ensureField(force) {
    const vb = map.getBounds();
    if (!force && field && field.bounds.contains(vb) && Math.abs(field.zoom - map.getZoom()) < 2) return;
    const pad = vb.pad(0.35);
    const s = Math.max(-80, pad.getSouth()), n = Math.min(80, pad.getNorth()), w = pad.getWest(), e = pad.getEast();
    const lats = [], lons = [];
    for (let r = 0; r < GRID; r++) for (let c = 0; c < GRID; c++) {
      lats.push((n - (r / (GRID - 1)) * (n - s)).toFixed(3));
      lons.push((((w + (c / (GRID - 1)) * (e - w)) + 540) % 360 - 180).toFixed(3));
    }
    const seq = ++fieldSeq;
    $("maploading").hidden = false;
    try {
      const p = new URLSearchParams({ latitude: lats.join(","), longitude: lons.join(","), hourly: "precipitation,cloud_cover,temperature_2m,wind_speed_10m", forecast_days: "3", timezone: "GMT", wind_speed_unit: "kmh" });
      const r = await fetch("https://api.open-meteo.com/v1/forecast?" + p);
      if (!r.ok) throw new Error("HTTP " + r.status);
      let j = await r.json();
      if (!Array.isArray(j)) j = [j];
      if (seq !== fieldSeq) return;
      const times = j[0].hourly.time;
      const pick = (k) => j.map((loc) => loc.hourly[k]);
      field = { bounds: L.latLngBounds([s, w], [n, e]), zoom: map.getZoom(), times, rain: pick("precipitation"), cloud: pick("cloud_cover"), temp: pick("temperature_2m"), wind: pick("wind_speed_10m") };
      const nowUtc = new Date(); const key = nowUtc.toISOString().slice(0, 13) + ":00";
      const startIdx = Math.max(0, times.indexOf(key));
      field.start = startIdx;
      const max = Math.min(47, times.length - 1 - startIdx);
      $("tslider").max = String(max);
      if (tIndex > max) tIndex = 0;
      $("tslider").value = String(tIndex);
      drawField();
    } catch (e) {
      // the coloured field is a bonus; the plain map still works
    } finally { if (seq === fieldSeq) $("maploading").hidden = true; }
  }

  function drawField() {
    if (!field) return;
    const ti = field.start + tIndex;
    const n = GRID, R = 160;
    const cv = document.createElement("canvas"); cv.width = R; cv.height = R;
    const ctx = cv.getContext("2d"), img = ctx.createImageData(R, R);
    const val = (arr, r, c) => { const a = arr[r * n + c]; return a ? a[ti] : null; };
    const sample = (arr, x, y) => {
      const gx = (x / (R - 1)) * (n - 1), gy = (y / (R - 1)) * (n - 1);
      const c0 = Math.floor(gx), r0 = Math.floor(gy), c1 = Math.min(n - 1, c0 + 1), r1 = Math.min(n - 1, r0 + 1), fx = gx - c0, fy = gy - r0;
      const v00 = val(arr, r0, c0), v01 = val(arr, r0, c1), v10 = val(arr, r1, c0), v11 = val(arr, r1, c1);
      if (v00 == null || v01 == null || v10 == null || v11 == null) return null;
      return (v00 * (1 - fx) + v01 * fx) * (1 - fy) + (v10 * (1 - fx) + v11 * fx) * fy;
    };
    for (let y = 0; y < R; y++) for (let x = 0; x < R; x++) {
      let col = [0, 0, 0, 0];
      if (layer === "rain") {
        const cl = sample(field.cloud, x, y), rn = sample(field.rain, x, y);
        const cc = cl == null ? [0, 0, 0, 0] : lerpColor(SCALES.cloud.stops, cl);
        const rc = rn == null ? [0, 0, 0, 0] : lerpColor(SCALES.rain.stops, rn);
        const a = rc[3] / 255;
        col = [rc[0] * a + cc[0] * (1 - a), rc[1] * a + cc[1] * (1 - a), rc[2] * a + cc[2] * (1 - a), Math.max(rc[3], cc[3])];
      } else {
        const v = sample(layer === "temp" ? field.temp : field.wind, x, y);
        if (v != null) col = lerpColor(SCALES[layer].stops, v);
      }
      const o = (y * R + x) * 4;
      img.data[o] = col[0]; img.data[o + 1] = col[1]; img.data[o + 2] = col[2]; img.data[o + 3] = col[3];
    }
    ctx.putImageData(img, 0, 0);
    const url = cv.toDataURL();
    if (overlay) overlay.setUrl(url).setBounds(field.bounds);
    else overlay = L.imageOverlay(url, field.bounds, { opacity: 0.85, interactive: false, className: "wx-field" }).addTo(map);
    const el = overlay.getElement(); if (el) el.style.imageRendering = "auto";
    // label + legend
    const t = new Date(field.times[ti] + "Z");
    const today = new Date();
    $("tlabel").textContent = (t.toDateString() === today.toDateString() ? "วันนี้" : DAY_SHORT[t.getDay()] + " " + t.getDate()) + " " + String(t.getHours()).padStart(2, "0") + ":00 น.";
    drawScale();
  }
  function drawScale() {
    const key = layer === "rain" ? "rain" : layer;
    const sc = SCALES[key];
    const stops = sc.stops.filter((s) => s[1][3] > 0);
    const g = stops.slice().reverse().map((s, i) => "rgba(" + s[1].slice(0, 3).join(",") + ",1) " + Math.round((i / (stops.length - 1)) * 100) + "%").join(",");
    $("scale").innerHTML = '<span>' + sc.unit + '</span><span class="bar" style="background:linear-gradient(' + g + ')"></span><span class="ends"><span>' + sc.hi + "</span><span>" + sc.lo + "</span></span>";
  }
  function setMapTimeByIndex(hIdx) {
    if (!field || !fc) return;
    const localKey = fc.hourly.time[hIdx];
    const off = (fc.utc_offset_seconds || 0) * 1000;
    const utc = new Date(new Date(localKey + "Z").getTime() - off).toISOString().slice(0, 13) + ":00";
    const k = field.times.indexOf(utc) - field.start;
    if (k >= 0 && k <= Number($("tslider").max)) { tIndex = k; $("tslider").value = String(k); drawField(); }
  }
  $("tslider").addEventListener("input", (e) => { tIndex = Number(e.target.value); drawField(); });
  $("play").onclick = () => {
    if (playTimer) { clearInterval(playTimer); playTimer = null; $("play").textContent = "▶"; return; }
    $("play").textContent = "❚❚";
    playTimer = setInterval(() => {
      tIndex = (tIndex + 1) % (Number($("tslider").max) + 1);
      $("tslider").value = String(tIndex);
      drawField();
    }, 450);
  };
  document.querySelectorAll(".layers button").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.layer === layer));
    b.onclick = () => {
      layer = b.dataset.layer; store.set("wx-layer", layer);
      document.querySelectorAll(".layers button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      drawField(); drawScale();
    };
  });

  let lastLoad = Date.now();
  document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - lastLoad > 15 * 60 * 1000) { lastLoad = Date.now(); loadForecast(); if (map) ensureField(true); } });
  let rt = null;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (fc) renderTable(); }, 200); });

  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});

  renderHeader();
  drawScale();
  initMap();
  loadForecast();
})();
</script>
</body>
</html>
