name: Update river flood risk
on:
  schedule:
    - cron: "30 */3 * * *"   # every 3 h: fills the normal-flow table in steps, refreshes peaks once a day
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_rivers.py
      - name: Commit data
        if: always()   # keep the progress made even when a later step fails
        run: |
          git config user.name "rivers-bot"
          git config user.email "rivers-bot@users.noreply.github.com"
          git add -A rivers rivers-geom.json rivers-flow.json 2>/dev/null || git add -A rivers-geom.json rivers-flow.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update river flood risk data"
          git pull --rebase origin main && git push
